<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JhollFood - Cardápio Virtual</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fff8f0;
}

header {
    background-color: #d62828;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    margin: 0;
}

.container {
    padding: 20px;
}

.categoria {
    margin-bottom: 30px;
}

.item {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}

.preco {
    color: #d62828;
    font-weight: bold;
}

.botao {
    display: block;
    text-align: center;
    background-color: #25d366;
    color: white;
    padding: 15px;
    text-decoration: none;
    border-radius: 10px;
    margin: 20px auto;
    width: 200px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 15px;
    background-color: #eee;
}
</style>
</head>

<body>

<header>
    <h1>🍔 JhollFood</h1>
    <p>O melhor sabor da cidade!</p>
</header>

<div class="container">

    <div class="categoria">
        <h2>🍔 Lanches</h2>

        <div class="item">
            <h3>X-Burger</h3>
            <p>Pão, carne, queijo e salada</p>
            <p class="preco">R$ 18,00</p>
        </div>

        <div class="item">
            <h3>X-Tudo</h3>
            <p>Pão, carne, queijo, presunto, ovo e bacon</p>
            <p class="preco">R$ 25,00</p>
        </div>
    </div>

    <div class="categoria">
        <h2>🥤 Bebidas</h2>

        <div class="item">
            <h3>Refrigerante Lata</h3>
            <p class="preco">R$ 6,00</p>
        </div>

        <div class="item">
            <h3>Suco Natural</h3>
            <p class="preco">R$ 8,00</p>
        </div>
    </div>

    <a class="botao" href="https://wa.me/5599999999999" target="_blank">
        Fazer Pedido no WhatsApp
    </a>

</div>

<footer>
    © 2026 JhollFood - Todos os direitos reservados
</footer>

</body>
</html>
